<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniMax H3 camera shots have moved · Loop Forge</title>
<link rel="canonical" href="https://loopforge.cc/projects/h3-camera-shots/">
<!-- This gallery now lives on the Loop Forge site. The address stays published because it is linked from
     the YouTube video, so this page forwards to the new one. A shot anchor (#dolly-zoom, or the old
     prompt anchors like #p-K-06n) goes straight to that shot's own page. -->
<script>
  (function () {
    var base = "https://loopforge.cc/projects/h3-camera-shots/";
    var prompts = {"C-01b": "crash-zoom-in", "C-08": "yoyo-zoom", "K-06n": "dolly-zoom", "D-05": "snorricam",
      "D-03": "rack-focus", "D-04": "split-screen", "C-02": "whip-pan", "C-09": "dutch-angle", "C-03": "super-dolly-in",
      "C-10": "eyes-in", "C-06": "aerial-pullback", "C-07": "handheld", "C-04": "orbit-360", "C-05": "crane-rise"};
    var shots = {};
    for (var id in prompts) shots[prompts[id]] = true;
    var hash = decodeURIComponent(location.hash.slice(1));
    var slug = shots[hash] ? hash : prompts[hash.replace(/^p-/, "")];
    location.replace(slug ? base + slug + "/" : base);
  })();
</script>
<meta http-equiv="refresh" content="0; url=https://loopforge.cc/projects/h3-camera-shots/">

  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font: 18px/1.5 system-ui, sans-serif; background: #f3f2f8; color: #1c1a33; text-align: center; }
  a { color: #b8266f; }
  @media (prefers-color-scheme: dark) { body { background: #13121f; color: #ecebf5; } a { color: #f06bb8; } }
</style>
</head>
